[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "boundedqr"
version = "0.1.0"
readme = "README.md"
description = "Bounded-memory clustered wild-gradient quantile regression with numerical error checks"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
dependencies = ["numpy>=1.26", "scipy>=1.13", "threadpoolctl>=3.1"]

[project.optional-dependencies]
gpu = ["cupy-cuda13x[ctk]>=14"]
test = ["pytest>=8"]
dev = ["pytest>=8", "matplotlib>=3.8", "pandas>=2", "psutil>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"boundedqr._vendor" = ["PYFIXEST_LICENSE"]

[tool.pytest.ini_options]
testpaths = ["checks"]
python_files = ["check_*.py"]
