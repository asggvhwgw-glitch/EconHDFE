[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "econhdfe-within"
version = "0.1.0a2"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]
description = "Experimental native structured FE reductions over pinned within"
license = "BSD-3-Clause AND MIT"
license-files = ["LICENSE-WITHIN"]

[tool.maturin]
features = ["extension-module"]
module-name = "_econhdfe_within"
