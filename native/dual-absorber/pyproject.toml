[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "econhdfe-dual-prototype"
version = "0.1.0a1"
requires-python = ">=3.10"
description = "Experimental certified dual-kernel categorical FE absorption"
license = "BSD-3-Clause"
dependencies = ["numpy>=1.24"]

[tool.maturin]
python-source = "python"
module-name = "econhdfe_dual._native"
profile = "release"
