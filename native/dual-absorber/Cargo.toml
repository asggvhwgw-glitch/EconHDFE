[package]
name = "econhdfe-dual-prototype"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "BSD-3-Clause"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310", "extension-module"] }
numpy = "0.29"
ndarray = "0.17"
rayon = "1.12"
serde_json = "1"
within = { git = "https://github.com/py-econometrics/within", rev = "fc44282cea6124f5f18bb142908605a656d35a7c" }
fereg-core = { git = "https://github.com/leoliu0/fereg", rev = "0fa59e3b539addbddaee8bd71acd031c497166a0" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
