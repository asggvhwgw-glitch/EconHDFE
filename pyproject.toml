[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "econhdfe"
version = "0.7.0.dev0"
description = "High-performance econometric estimators with shared high-dimensional fixed-effect infrastructure"
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
authors = [{name = "econhdfe contributors"}]
requires-python = ">=3.10"
keywords = ["econometrics", "fixed-effects", "high-dimensional", "instrumental-variables", "poisson", "ppml", "panel-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.0", "numba>=0.59", "joblib>=1.3", "threadpoolctl>=3.2"]

[project.scripts]
econhdfe-report = "econhdfe.support_reports:main"

[project.optional-dependencies]
gpu = ["cupy-cuda12x>=13"]
io = ["polars>=1.0", "pyarrow>=15", "pyreadstat>=1.2"]
test = ["pytest>=8", "statsmodels>=0.14", "packaging>=23"]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.package-data]
econhdfe = ["templates/*.md"]

[tool.setuptools.packages.find]
where = ["."]
include = ["econhdfe*", "pyreghdfe*"]

[tool.pytest.ini_options]
# Daily regression surface. CI and release builds explicitly select tests/ (full).
testpaths = ["tests/contracts", "tests/behavior"]
addopts = "--strict-config --strict-markers"
