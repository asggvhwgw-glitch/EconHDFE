name: Apply verified nonlinear profiling changes
on:
  push:
    branches:
      - feature/ppml-ivppml-native-weighted-within-20261027
    paths:
      - .github/workflows/apply-ppml-profile-20261027.yml
permissions:
  contents: write
jobs:
  apply-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and apply locally tested patch
        shell: bash
        run: |
          python - <<'PY'
          import gzip, hashlib, pathlib, subprocess
          patch = gzip.decompress(pathlib.Path('.github/ppml-profile.patch.gz').read_bytes())
          expected = '05c7d492c17edaa166b2aba7f9d37aebcbabb5e5e8a530b1bd6f65914195bc48'
          assert hashlib.sha256(patch).hexdigest() == expected, 'Patch checksum mismatch'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
      - name: Remove temporary patch transport and regenerate architecture
        run: |
          git rm .github/ppml-profile.patch.gz .github/workflows/apply-ppml-profile-20261027.yml
          python skills/econhdfe/scripts/architecture_map.py
          python skills/econhdfe/scripts/architecture_map.py --check
      - name: Commit verified implementation and deterministic documents
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add benchmarks/hdfe/ppml_end_to_end_profile.py benchmarks/hdfe/ppml_native_profile_1m_20261027.json
          git diff --cached --check
          git commit -m 'fix: certify native nonlinear projections and add million-row profiling evidence'
          git push origin HEAD:feature/ppml-ivppml-native-weighted-within-20261027
