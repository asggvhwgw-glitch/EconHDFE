name: Apply validated adaptive runtime files
on:
  push:
    branches: [feature/ppml-adaptive-routing-20261027]
    paths: [.github/workflows/apply-adaptive-routing.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply the checksummed non-workflow patch
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "394f70bcf21d058a9b56addf135931d4c6764b6b"
          python - <<'PYCODE'
          import base64, hashlib, subprocess, zlib
          original = subprocess.check_output(['git','show','394f70bcf21d058a9b56addf135931d4c6764b6b:.github/workflows/apply-adaptive-routing.yml'], text=True)
          payload = original.split('payload = """', 1)[1].split('"""', 1)[0]
          patch = zlib.decompress(base64.b64decode(''.join(payload.split()), validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'd8416c755f260cb7e626d562c7ccbeda69ef2a191127781f972c96fcd7944ba7'
          subprocess.run(['git','apply','--index','--whitespace=error-all','--exclude=.github/workflows/ppml-native-benchmark.yml','-'], input=patch, check=True)
          PYCODE
      - name: Generate final-layout maps and commit runtime files only
        shell: bash
        run: |
          rm .github/workflows/apply-adaptive-routing.yml
          python skills/econhdfe/scripts/architecture_map.py
          python skills/econhdfe/scripts/architecture_map.py --check
          git checkout HEAD -- .github/workflows/apply-adaptive-routing.yml
          python -m compileall -q econhdfe
          python - <<'PYCODE'
          import hashlib, json
          from pathlib import Path
          manifest=json.loads(Path('benchmarks/hdfe/ppml_adaptive_profile_1m_20261027.json').read_text())
          for name, expected in manifest['runtime_files_sha256'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          PYCODE
          git add docs/development/architecture-map/architecture.json docs/development/architecture-map/architecture.md docs/development/architecture-map/architecture.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: opt-in bounded adaptive PPML routing with transactional fallback'
          git push origin HEAD:feature/ppml-adaptive-routing-20261027
