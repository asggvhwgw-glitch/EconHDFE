name: fereg vs within FE-topology benchmark
on:
  push:
    branches: [bench/fereg-within-topologies-20261029]
    paths:
      - benchmarks/hdfe/fereg_within_topologies.py
      - .github/workflows/fereg-within-topologies.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fereg-within-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fereg-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --upgrade pip maturin
      - name: Build pinned fereg 0.5.0 source revision
        run: |
          mkdir -p wheelhouse
          python -m pip wheel --no-deps -w wheelhouse \
            'fereg @ git+https://github.com/leoliu0/fereg.git@0fa59e3b539addbddaee8bd71acd031c497166a0#subdirectory=python'
          ls -lh wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: fereg-benchmark-wheel
          path: wheelhouse/*.whl
          if-no-files-found: error
  benchmark:
    needs: fereg-wheel
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        case: [one_big, two_big, three_big, weak_links, hub, repeated_cells, reweight]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RAYON_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: fereg-benchmark-wheel
          path: wheelhouse
      - name: Install binaries and verify
        run: |
          python -m pip install wheelhouse/*.whl 'within_py==0.4.0' 'numpy>=1.26,<3' 'pandas>=2.1,<3' psutil
          python -c 'import fereg,within; print("fereg",fereg.__file__,"within",within.__file__)'
          lscpu | head -25
          free -h
      - name: Benchmark full estimators and native within projection
        shell: bash
        run: |
          mkdir -p benchmark-results
          set +e
          for size in 120000 1000000; do
            for method in fereg within within_additive; do
              echo "START case=${{ matrix.case }} rows=$size method=$method"
              timeout 280s python benchmarks/hdfe/fereg_within_topologies.py \
                --case "${{ matrix.case }}" --method "$method" --rows "$size" \
                --threads 2 --reps 2 | tee -a benchmark-results/results.jsonl
              code=${PIPESTATUS[0]}
              echo "EXIT_STATUS case=${{ matrix.case }} rows=$size method=$method status=$code" | tee -a benchmark-results/status.txt
            done
          done
          if [[ "${{ matrix.case }}" == "one_big" || "${{ matrix.case }}" == "two_big" || "${{ matrix.case }}" == "three_big" || "${{ matrix.case }}" == "weak_links" ]]; then
            for method in fereg within; do
              echo "START large case=${{ matrix.case }} method=$method"
              timeout 320s python benchmarks/hdfe/fereg_within_topologies.py \
                --case "${{ matrix.case }}" --method "$method" --rows 5000000 \
                --threads 2 --reps 1 | tee -a benchmark-results/results.jsonl
              code=${PIPESTATUS[0]}
              echo "EXIT_STATUS case=${{ matrix.case }} rows=5000000 method=$method status=$code" | tee -a benchmark-results/status.txt
            done
          fi
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: topology-${{ matrix.case }}-${{ github.run_id }}
          path: benchmark-results/
          if-no-files-found: warn
