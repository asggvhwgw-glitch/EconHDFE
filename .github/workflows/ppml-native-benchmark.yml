name: Native nonlinear weighted projection benchmark
on:
  pull_request:
    paths:
      - benchmarks/hdfe/ppml_dynamic_weights.py
      - benchmarks/hdfe/ppml_end_to_end_profile.py
      - tests/numerics/test_ppml_within_integration.py
      - .github/workflows/ppml-native-benchmark.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '2'
      RAYON_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -e '.[test]' maturin
      - run: python -m pip wheel --no-deps ./native/within-accel -w native-wheels
      - run: python -m pip install native-wheels/*.whl
      - name: Dynamic weights 100k, 3 FE
        run: |
          mkdir -p benchmark-results
          python benchmarks/hdfe/ppml_dynamic_weights.py --rows 100000 --budget-mb 768 > benchmark-results/dynamic-100k.json
          cat benchmark-results/dynamic-100k.json
      - name: Dynamic weights 1m, 3 FE
        run: |
          python benchmarks/hdfe/ppml_dynamic_weights.py --rows 1000000 --budget-mb 1536 > benchmark-results/dynamic-1m.json
          cat benchmark-results/dynamic-1m.json
      - name: Complete estimators, four million-row structures
        run: |
          for case in repeated crossed weak schur; do
            for model in ppml ivppml; do
              python benchmarks/hdfe/ppml_end_to_end_profile.py --rows 1000000 --budget-mb 2048 --case "$case" --model "$model" --repeat 1 --seed 20261028 --output "benchmark-results/${case}-${model}.json" > "benchmark-results/${case}-${model}.log" 2>&1 || { cat "benchmark-results/${case}-${model}.log"; exit 1; }
            done
          done
      - name: Adaptive routing, four million-row structures
        run: |
          for case in repeated crossed weak schur; do
            for model in ppml ivppml; do
              python benchmarks/hdfe/ppml_end_to_end_profile.py --candidate adaptive --rows 1000000 --budget-mb 2048 --case "$case" --model "$model" --repeat 1 --seed 20261029 --output "benchmark-results/adaptive-${case}-${model}.json" > "benchmark-results/adaptive-${case}-${model}.log" 2>&1 || { cat "benchmark-results/adaptive-${case}-${model}.log"; exit 1; }
            done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nonlinear-within-bench-${{ runner.os }}-${{ github.run_id }}
          path: benchmark-results/
