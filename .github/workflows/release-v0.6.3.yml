name: Publish release

# Stable path retained because PyPI Trusted Publishing is bound to this workflow
# filename. The workflow itself is version-agnostic; do not rename this file
# without updating the PyPI publisher configuration first.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v (for example 0.6.4)
        required: true
        type: string
      source_run:
        description: Successful Tests and release validation run ID for the frozen commit
        required: true
        type: string
      source_commit:
        description: Full 40-character commit SHA bound by the detached release acceptance record
        required: true
        type: string
      release_notes_file:
        description: Optional repository-relative Markdown file at the frozen commit; empty uses GitHub generated notes
        required: false
        default: ''
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: false
        default: false
        type: boolean
      publish_pypi:
        description: Publish the exact frozen wheel and sdist to PyPI after GitHub Release succeeds
        required: false
        default: true
        type: boolean

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      wheel_sha256: ${{ steps.verify.outputs.wheel_sha256 }}
      sdist_sha256: ${{ steps.verify.outputs.sdist_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      SOURCE_RUN: ${{ inputs.source_run }}
      FROZEN_SHA: ${{ inputs.source_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}

      - name: Validate frozen source and CI identity
        shell: bash
        run: |
          python - <<'PY'
          import os, re, tomllib
          version = os.environ['VERSION']
          commit = os.environ['FROZEN_SHA']
          run = os.environ['SOURCE_RUN']
          if not re.fullmatch(r'[0-9][0-9A-Za-z.]*', version):
              raise SystemExit('unsafe or unsupported release version string')
          if not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('source_commit must be a full lowercase 40-character SHA')
          if not run.isdigit():
              raise SystemExit('source_run must be a numeric GitHub Actions run ID')
          project = tomllib.loads(open('pyproject.toml', 'rb').read().decode())['project']
          if project['version'] != version:
              raise SystemExit(f"pyproject version {project['version']} != requested {version}")
          PY
          run_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)
          run_conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .conclusion)
          run_path=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .path)
          test "$run_sha" = "$FROZEN_SHA" || { echo "source run SHA $run_sha != $FROZEN_SHA"; exit 1; }
          test "$run_conclusion" = success || { echo "source run conclusion is $run_conclusion"; exit 1; }
          test "$run_path" = .github/workflows/ci.yml || { echo "unexpected validation workflow: $run_path"; exit 1; }

      - name: Download frozen release candidate
        shell: bash
        run: |
          mkdir release-assets
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name release-candidate --dir release-assets

      - name: Verify release asset set and hashes
        id: verify
        shell: bash
        run: |
          WHEEL="econhdfe-${VERSION}-py3-none-any.whl"
          SDIST="econhdfe-${VERSION}.tar.gz"
          SKILL="econhdfe-skill-v${VERSION}.zip"
          BUNDLE="econhdfe-v${VERSION}-release-bundle.zip"
          SOURCE="econhdfe-v${VERSION}-source.zip"
          expected=("$WHEEL" "$SDIST" "$SKILL" "$BUNDLE" "$SOURCE")
          for name in "${expected[@]}"; do
            test -f "release-assets/$name" || { echo "missing frozen artifact: $name"; exit 1; }
          done
          mapfile -t actual < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t wanted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${actual[*]}" = "${wanted[*]}" || {
            echo "unexpected release-candidate contents"
            printf 'actual: %s\n' "${actual[*]}"
            printf 'wanted: %s\n' "${wanted[*]}"
            exit 1
          }
          (cd release-assets && sha256sum "${expected[@]}" > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          echo "wheel_sha256=$(sha256sum "release-assets/$WHEEL" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "sdist_sha256=$(sha256sum "release-assets/$SDIST" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create or verify release tag
        shell: bash
        run: |
          TAG="v${VERSION}"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > tag.json 2>/dev/null; then
            actual=$(jq -r '.object.sha' tag.json)
            test "$actual" = "$FROZEN_SHA" || { echo "tag points to $actual, expected $FROZEN_SHA"; exit 1; }
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$FROZEN_SHA"
          fi

      - name: Create GitHub Release
        shell: bash
        env:
          NOTES_FILE: ${{ inputs.release_notes_file }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite an immutable release."
            exit 1
          fi
          notes=()
          if [ -n "$NOTES_FILE" ]; then
            case "$NOTES_FILE" in /*|*..*) echo 'release_notes_file must be a safe repository-relative path'; exit 1;; esac
            test -f "$NOTES_FILE" || { echo "release notes not found: $NOTES_FILE"; exit 1; }
            notes=(--notes-file "$NOTES_FILE")
          else
            notes=(--generate-notes)
          fi
          prerelease=()
          if [ "$IS_PRERELEASE" = true ]; then prerelease=(--prerelease); fi
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "EconHDFE v${VERSION}" \
            "${notes[@]}" "${prerelease[@]}"

  pypi-publish:
    if: ${{ inputs.publish_pypi }}
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      SOURCE_RUN: ${{ inputs.source_run }}
    steps:
      - name: Download the same frozen distributions
        shell: bash
        run: |
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name release-candidate --dir frozen
          WHEEL="econhdfe-${VERSION}-py3-none-any.whl"
          SDIST="econhdfe-${VERSION}.tar.gz"
          mkdir pypi-dist
          cp "frozen/$WHEEL" "frozen/$SDIST" pypi-dist/
          echo "${{ needs.github-release.outputs.wheel_sha256 }}  pypi-dist/$WHEEL" | sha256sum -c -
          echo "${{ needs.github-release.outputs.sdist_sha256 }}  pypi-dist/$SDIST" | sha256sum -c -

      - name: Publish exact frozen distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e
        with:
          packages-dir: pypi-dist/
          attestations: true
