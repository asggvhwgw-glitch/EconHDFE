name: Temporary documentation artifact refresh

on:
  push:
    branches: [docs/bilingual-cleanup]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'README.zh-CN.md'
      - '.github/workflows/docs-refresh-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-refresh-temp
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/bilingual-cleanup
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            latexmk texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended poppler-utils
      - name: Refresh architecture map
        run: python skills/econhdfe/scripts/architecture_map.py
      - name: Compile project technical documents
        shell: bash
        run: |
          set -euo pipefail
          compile_one() {
            dir="$1"
            tex="$2"
            (
              cd "$dir"
              latexmk -pdf -interaction=nonstopmode -halt-on-error "$tex"
              log="${tex%.tex}.log"
              if grep -E 'LaTeX Warning:.*undefined|There were undefined references|Citation .* undefined|Reference .* undefined' "$log"; then
                exit 1
              fi
              if grep -F 'Overfull \\hbox' "$log"; then
                exit 1
              fi
            )
          }
          compile_one docs/technical/hdfe/exact-multiway-dof exact_multiway_hdfe_dof.tex
          compile_one docs/technical/hdfe/numerical-residual-core exact_multiway_hdfe_residual_core.tex
          compile_one docs/technical/structural-design exact_partition_refinement_hdfe_design.tex
      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/development/architecture-map/architecture.json \
            docs/development/architecture-map/architecture.md \
            docs/development/architecture-map/architecture.html \
            docs/technical/hdfe/exact-multiway-dof/exact_multiway_hdfe_dof.pdf \
            docs/technical/hdfe/numerical-residual-core/exact_multiway_hdfe_residual_core.pdf \
            docs/technical/structural-design/exact_partition_refinement_hdfe_design.pdf
          if git diff --cached --quiet; then
            echo "Generated artifacts already current."
            exit 0
          fi
          git commit -m "Refresh generated documentation artifacts"
          git push origin HEAD:docs/bilingual-cleanup
