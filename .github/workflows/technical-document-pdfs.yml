name: Project technical document PDFs

on:
  pull_request:
    paths:
      - 'docs/technical/hdfe/exact-multiway-dof/*.tex'
      - 'docs/technical/hdfe/exact-multiway-dof/*.pdf'
      - 'docs/technical/hdfe/numerical-residual-core/*.tex'
      - 'docs/technical/hdfe/numerical-residual-core/*.pdf'
      - 'docs/technical/structural-design/*.tex'
      - 'docs/technical/structural-design/*.pdf'
      - 'formal/appendices/*.tex'
      - '.github/workflows/technical-document-pdfs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/technical/hdfe/exact-multiway-dof/*.tex'
      - 'docs/technical/hdfe/exact-multiway-dof/*.pdf'
      - 'docs/technical/hdfe/numerical-residual-core/*.tex'
      - 'docs/technical/hdfe/numerical-residual-core/*.pdf'
      - 'docs/technical/structural-design/*.tex'
      - 'docs/technical/structural-design/*.pdf'
      - 'formal/appendices/*.tex'
      - '.github/workflows/technical-document-pdfs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manuscript-pdfs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Preserve tracked technical-document PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/tracked-documents
          cp docs/technical/hdfe/exact-multiway-dof/exact_multiway_hdfe_dof.pdf /tmp/tracked-documents/
          cp docs/technical/hdfe/numerical-residual-core/exact_multiway_hdfe_residual_core.pdf /tmp/tracked-documents/
          cp docs/technical/structural-design/exact_partition_refinement_hdfe_design.pdf /tmp/tracked-documents/
      - name: Install TeX and PDF inspection tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            latexmk texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended poppler-utils
      - name: Compile project technical documents
        shell: bash
        run: |
          set -euo pipefail
          compile_one() {
            dir="$1"
            tex="$2"
            (
              cd "$dir"
              latexmk -pdf -interaction=nonstopmode -halt-on-error "$tex"
              log="${tex%.tex}.log"
              if grep -E 'LaTeX Warning:.*undefined|There were undefined references|Citation .* undefined|Reference .* undefined' "$log"; then
                echo "Undefined LaTeX reference/citation detected in $dir/$tex" >&2
                exit 1
              fi
              if grep -F 'Overfull \\hbox' "$log"; then
                echo "Overfull box detected in $dir/$tex" >&2
                exit 1
              fi
            )
          }
          compile_one docs/technical/hdfe/exact-multiway-dof exact_multiway_hdfe_dof.tex
          compile_one docs/technical/hdfe/numerical-residual-core exact_multiway_hdfe_residual_core.tex
          compile_one docs/technical/structural-design exact_partition_refinement_hdfe_design.tex
      - name: Inspect and compare generated PDFs
        shell: bash
        run: |
          set -euo pipefail
          check_one() {
            pdf="$1"
            tracked="/tmp/tracked-documents/$(basename "$pdf")"
            echo "===== $pdf ====="
            pdfinfo "$pdf" | grep -E '^(Pages|Page size|File size|PDF version):'
            pdftotext "$pdf" /tmp/generated.txt
            pdftotext "$tracked" /tmp/tracked.txt
            grep -q 'Lean formalization' /tmp/generated.txt
            diff -u /tmp/tracked.txt /tmp/generated.txt
            test "$(pdfinfo "$tracked" | awk '/^Pages:/ {print $2}')" = \
                 "$(pdfinfo "$pdf" | awk '/^Pages:/ {print $2}')"
          }
          check_one docs/technical/hdfe/exact-multiway-dof/exact_multiway_hdfe_dof.pdf
          check_one docs/technical/hdfe/numerical-residual-core/exact_multiway_hdfe_residual_core.pdf
          check_one docs/technical/structural-design/exact_partition_refinement_hdfe_design.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: project-technical-documents
          path: |
            docs/technical/hdfe/exact-multiway-dof/exact_multiway_hdfe_dof.pdf
            docs/technical/hdfe/numerical-residual-core/exact_multiway_hdfe_residual_core.pdf
            docs/technical/structural-design/exact_partition_refinement_hdfe_design.pdf
          if-no-files-found: error
