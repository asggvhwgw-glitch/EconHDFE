name: Temporary rebuild technical PDFs

on:
  push:
    branches: [docs/bilingual-cleanup-20260929]
    paths:
      - '.github/workflows/rebuild-manuscripts-temp.yml'
      - 'docs/technical/hdfe/exact-multiway-dof/*.tex'
      - 'docs/technical/hdfe/numerical-residual-core/*.tex'
      - 'docs/technical/structural-design/*.tex'
      - 'formal/appendices/*.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/bilingual-cleanup-20260929
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            latexmk texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended poppler-utils
      - name: Compile project technical documents
        shell: bash
        run: |
          set -euo pipefail
          compile_one() {
            dir="$1"
            tex="$2"
            (
              cd "$dir"
              latexmk -pdf -interaction=nonstopmode -halt-on-error "$tex"
              log="${tex%.tex}.log"
              ! grep -E 'LaTeX Warning:.*undefined|There were undefined references|Citation .* undefined|Reference .* undefined' "$log"
              ! grep -F 'Overfull \\hbox' "$log"
            )
          }
          compile_one docs/technical/hdfe/exact-multiway-dof exact_multiway_hdfe_dof.tex
          compile_one docs/technical/hdfe/numerical-residual-core exact_multiway_hdfe_residual_core.tex
          compile_one docs/technical/structural-design exact_partition_refinement_hdfe_design.tex
      - name: Commit regenerated PDFs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/technical/hdfe/exact-multiway-dof/exact_multiway_hdfe_dof.pdf \
            docs/technical/hdfe/numerical-residual-core/exact_multiway_hdfe_residual_core.pdf \
            docs/technical/structural-design/exact_partition_refinement_hdfe_design.pdf
          if git diff --cached --quiet; then
            echo "PDFs already current."
            exit 0
          fi
          git commit -m "Rebuild project technical document PDFs"
          git push origin HEAD:docs/bilingual-cleanup-20260929
