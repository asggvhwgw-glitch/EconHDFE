name: Finalize native Poisson architecture map
on:
  push:
    branches:
      - feature/ppml-ivppml-native-weighted-within-20261027
    paths:
      - .github/workflows/sync-ppml-architecture.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Delete one-time workflow before generating maps
        run: git rm .github/workflows/sync-ppml-architecture.yml
      - name: Regenerate exact final-tree architecture maps
        run: python skills/econhdfe/scripts/architecture_map.py
      - name: Commit only generated maps and one-time workflow deletion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/development/architecture-map/architecture.json docs/development/architecture-map/architecture.md docs/development/architecture-map/architecture.html
          git commit -m "docs: finalize architecture map for native nonlinear integration"
          git push origin HEAD:feature/ppml-ivppml-native-weighted-within-20261027
