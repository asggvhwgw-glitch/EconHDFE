name: Regenerate native PPML architecture map
on:
  push:
    branches:
      - feature/ppml-ivppml-native-weighted-within-20261027
    paths:
      - .github/workflows/sync-ppml-architecture.yml
permissions:
  contents: write
jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate checked-in architectural outputs
        run: python skills/econhdfe/scripts/architecture_map.py
      - name: Commit only generated documents
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/development/architecture-map/architecture.json docs/development/architecture-map/architecture.md docs/development/architecture-map/architecture.html
          if ! git diff --cached --quiet; then
            git commit -m "docs: synchronize native Poisson architectural outputs"
            git push origin HEAD:feature/ppml-ivppml-native-weighted-within-20261027
          fi
