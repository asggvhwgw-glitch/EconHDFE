name: Lean mathematical foundations
on:
  push:
    branches: [dev/lean-foundations]
    paths: ['formal/**', '.github/workflows/lean.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prove:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install fixed Lean toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve fixed mathematical dependencies
        run: |
          cd formal
          lake update
          lake exe cache get
          lean --version | tee ../lean-version.txt
          git -C .lake/packages/mathlib rev-parse HEAD | tee ../mathlib-commit.txt
          test "$(cat ../mathlib-commit.txt)" = c44e0c8ee63ca166450922a373c7409c5d26b00b
      - name: Compile all project proofs
        run: |
          cd formal
          lake build 2>&1 | tee ../lean-build.log
      - name: Audit proof axioms
        run: |
          cd formal
          python3 - <<'PY'
          import pathlib, re
          files = sorted(pathlib.Path('EconHDFE').glob('*.lean'))
          names = []
          for p in files:
              source = p.read_text()
              assert not re.search(r'\b(sorry|admit|axiom|native_decide|unsafe)\b', source), p
              names.extend('EconHDFE.' + n for n in re.findall(r'^theorem\s+(\w+)', source, re.M))
          pathlib.Path('AxiomAudit.lean').write_text('import EconHDFE\n' + '\n'.join('#print axioms ' + n for n in names) + '\n')
          pathlib.Path('../theorems.txt').write_text('\n'.join(names) + '\n')
          PY
          lake env lean AxiomAudit.lean 2>&1 | tee ../lean-axioms.log
          python3 - <<'PY'
          import pathlib, re
          s = pathlib.Path('../lean-axioms.log').read_text()
          assert 'sorryAx' not in s and 'error:' not in s, s
          for body in re.findall(r'depends on axioms:\s*\[([^]]*)\]', s):
              names = {x.strip() for x in body.split(',')} - {''}
              assert names <= {'propext', 'Classical.choice', 'Quot.sound'}, names
          PY
      - name: Assemble proof-only evidence
        if: always()
        run: |
          mkdir -p lean-evidence
          cp lean-*.log lean-version.txt mathlib-commit.txt theorems.txt lean-evidence/ 2>/dev/null || true
          cp formal/lake-manifest.json lean-evidence/ 2>/dev/null || true
          git rev-parse HEAD > lean-evidence/source-commit.txt
          find formal -maxdepth 2 -type f -not -path '*/.lake/*' -print0 | sort -z | xargs -0 sha256sum > lean-evidence/source-sha256.txt
          tar --exclude='.lake' -czf lean-evidence/formal-source.tar.gz formal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lean-foundations-evidence
          path: lean-evidence/
          if-no-files-found: error
