name: Synchronize native Poisson branch with 0.10.0
on:
  push:
    branches: [feature/ppml-ivppml-native-weighted-within-20261027]
    paths: [.github/workflows/sync-ppml-main-once.yml]
permissions:
  contents: write
jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge only the pinned main snapshot and regenerate derived documents
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = d8a44b3ab81d54d40eb4f5a136a763d309a64add
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin 2ab8cddd9a6e367291f3152591e09c1270418148
          if ! git merge --no-ff --no-commit 2ab8cddd9a6e367291f3152591e09c1270418148; then
            conflicts=$(git diff --name-only --diff-filter=U)
            test -n "$conflicts"
            while IFS= read -r path; do
              case "$path" in
                docs/development/architecture-map/architecture.json|docs/development/architecture-map/architecture.md|docs/development/architecture-map/architecture.html|docs/release/execution.json)
                  git checkout --theirs -- "$path"
                  git add "$path"
                  ;;
                *) echo "Unexpected source conflict: $path"; exit 1 ;;
              esac
            done <<< "$conflicts"
          fi
          git rm .github/workflows/sync-ppml-main-once.yml
          python skills/econhdfe/scripts/architecture_map.py
          git add docs/development/architecture-map/architecture.json docs/development/architecture-map/architecture.md docs/development/architecture-map/architecture.html
          git diff --check
          git commit -m "Merge pinned 0.10.0 main into native nonlinear integration"
          git push origin HEAD:feature/ppml-ivppml-native-weighted-within-20261027
