name: Finalize native feature-branch generated files
on:
  push:
    branches: [feat/within-native-accel-20261026]
    paths: [.github/workflows/within-maintenance.yml]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  finalize:
    if: github.repository == 'asggvhwgw-glitch/EconHDFE'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/within-native-accel-20261026
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Preserve weak-design protection and reject cancellation-prone Schur complements
        run: |
          python - <<'PY'
          from pathlib import Path
          def edit(path, old, new):
              p=Path(path); text=p.read_text()
              if new in text: return
              assert text.count(old)==1, path
              p.write_text(text.replace(old,new,1))
          edit('econhdfe/models/ols.py', 'backend == "numpy" and method_resolved == "map"', 'backend == "numpy" and method_resolved in {"map", "within"}')
          edit('econhdfe/sessions.py', 'len(entry.groups) > 1 and entry.solver_selection["resolved"] == "map"', 'len(entry.groups) > 1 and entry.solver_selection["resolved"] in {"map", "within"}')
          edit('native/within-accel/src/reductions.rs', '        let mut error = vec![0.0; q*q];', '        let raw_diag: Vec<f64> = (0..q).map(|j| b[j*q+j]).collect();\n        let mut error = vec![0.0; q*q];')
          edit('native/within-accel/src/reductions.rs', 'if b[j*q+j] <= 0.0 || !b[j*q+j].is_finite()', 'if b[j*q+j] <= 1e-10 * raw_diag[j] || !b[j*q+j].is_finite()')
          PY
      - name: Generate immutable dependency lock and canonical source formatting
        run: |
          cargo generate-lockfile --manifest-path native/within-accel/Cargo.toml
          cargo fmt --manifest-path native/within-accel/Cargo.toml
          python skills/econhdfe/scripts/architecture_map.py
      - name: Commit only feature-branch implementation and generated files
        run: |
          git add econhdfe/models/ols.py econhdfe/sessions.py native/within-accel/src docs/development/architecture-map
          git add -f native/within-accel/Cargo.lock
          git rm .github/workflows/within-maintenance.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Finalize guarded native integration, lock dependencies and refresh architecture maps'
          git push origin HEAD:refs/heads/feat/within-native-accel-20261026
      - name: Exercise native acceptance on this exact committed tree
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NUMBA_NUM_THREADS: '4'
          REQUIRE_WITHIN_NATIVE: '1'
        run: |
          mkdir -p native-results native-wheels
          python -m pip install -e '.[test]' maturin
          cargo test --release --locked --manifest-path native/within-accel/Cargo.toml 2>&1 | tee native-results/rust-tests.log
          python -m pip wheel --no-deps ./native/within-accel -w native-wheels -v 2>&1 | tee native-results/build.log
          python -m pip install native-wheels/*.whl
          python -m pytest native/within-accel/tests -q --junitxml=native-results/native-tests.xml 2>&1 | tee native-results/native-tests.log
          python scripts/run_tests.py --suite full -- -q 2>&1 | tee native-results/full-tests.log
          for case in schur repeated weighted; do
            for strategy in plain auto; do
              python native/within-accel/benchmark.py --case "$case" --strategy "$strategy" --rows 1000000 --repeat 3 --threads 2 | tee "native-results/${case}-${strategy}.json"
            done
          done
      - name: Archive executed source and environment
        if: always()
        run: |
          mkdir -p native-results
          git rev-parse HEAD > native-results/source-sha.txt
          git diff > native-results/uncommitted.diff
          python -m pip freeze > native-results/environment.txt
          git archive --format=zip HEAD > native-results/source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: within-finalized-${{ github.run_id }}
          path: |
            native-results/
            native-wheels/
